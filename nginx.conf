# Nginx reverse proxy → API (Docker Compose escala as réplicas; o DNS interno
# do Compose balanceia entre elas via o nome de serviço "api").
upstream lucrom_api {
    server api:3000;
}

server {
    listen 80;
    server_name _;

    # Tamanho de corpo e timeouts razoáveis para uma API.
    client_max_body_size 2m;
    proxy_read_timeout 30s;

    location / {
        proxy_pass http://lucrom_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Probe de readiness para health checks externos.
    location = /healthz {
        proxy_pass http://lucrom_api/api/v1/health/ready;
    }
}

# HTTPS: gere o certificado com certbot (host) ou adicione um server{} 443 aqui.
# Ex.: sudo certbot --nginx -d api.seudominio.com.br
